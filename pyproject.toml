[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "samvev-homeassistant"
version = "0.2.0"
description = "A thin Home Assistant adapter for Samvev"
readme = "README.md"
requires-python = ">=3.13.2"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Samvev contributors" }]
classifiers = [
  "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
  "homeassistant==2026.2.3",
  "mypy==2.3.1",
  "pytest-cov==7.0.0",
  "pytest-homeassistant-custom-component==0.13.316",
  "ruff==0.16.6",
]

[tool.uv]
# HA loads custom_components from disk; setuptools namespace path hooks are
# not valid filesystem directories for HA's custom-integration discovery.
package = false

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=custom_components.samvev --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "CPY001",
  "COM812",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "ISC001",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "ARG001", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
